services:
  # One-shot: seeds the Geyser config from git so the repo stays the source
  # of truth. Geyser only writes config.yml when it is missing, so this must
  # run before the server starts.
  config-init:
    image: alpine:3.20
    container_name: minecraft-config-init
    restart: "no"
    command:
      - /bin/sh
      - -c
      - |
        set -e
        mkdir -p /data/plugins/Geyser-Spigot /data/plugins/Plan
        rm -rf /data/plugins/Geyser-Spigot/config.yml /data/plugins/Plan/config.yml
        # Clone the repo rather than fetching raw.githubusercontent.com: the raw
        # CDN serves STALE copies of these files for minutes after a push, so
        # a wget here silently deploys the previous revision of the config.
        # A git clone always returns the pushed commit.
        apk add --no-cache git ca-certificates >/dev/null
        git clone --depth 1 https://github.com/chaseoriginal/minecraft-111 /src
        cp /src/geyser-config.yml /data/plugins/Geyser-Spigot/config.yml
        cp /src/plan-config.yml   /data/plugins/Plan/config.yml
        rm -rf /src
        chmod 644 /data/plugins/Geyser-Spigot/config.yml /data/plugins/Plan/config.yml
        # the server runs as uid 1000 and must own its own plugin dirs
        chown -R 1000:1000 /data/plugins/Geyser-Spigot /data/plugins/Plan
    volumes:
      - minecraft_data:/data

  # Plan requires HTTPS before it enables authentication, so it needs a
  # keystore. Generate a self-signed one on the data volume at startup - the
  # private key is never committed to git and never leaves the host.
  cert-init:
    image: eclipse-temurin:25-jdk
    container_name: minecraft-cert-init
    restart: "no"
    command:
      - /bin/sh
      - -c
      - |
        set -e
        mkdir -p /data/plugins/Plan
        if [ ! -f /data/plugins/Plan/Cert.p12 ]; then
          keytool -genkeypair -alias minecraft111 -keyalg RSA -keysize 2048 \
            -validity 3650 -storetype PKCS12 \
            -keystore /data/plugins/Plan/Cert.p12 \
            -storepass minecraft111 -keypass minecraft111 \
            -dname "CN=minecraft-111, OU=IT, O=Chase Original LLC, C=US" \
            -ext "SAN=dns:localhost,dns:mc.echoinggreen.net,ip:10.77.111.10"
          echo "generated self-signed keystore"
        else
          echo "keystore already present, keeping it"
        fi
        chown -R 1000:1000 /data/plugins/Plan
    volumes:
      - minecraft_data:/data

  minecraft:
    image: itzg/minecraft-server:java25
    depends_on:
      config-init:
        condition: service_completed_successfully
      cert-init:
        condition: service_completed_successfully
    container_name: minecraft
    stdin_open: true
    tty: true
    restart: unless-stopped
    ports:
      - "${BIND_IP}:25565:25565/tcp"   # Java Edition
      - "${BIND_IP}:19132:19132/udp"   # Bedrock gameplay (RakNet) - UDP is mandatory
      - "${BIND_IP}:19132:19132/tcp"   # Bedrock signaling (NetherNet) - TCP is mandatory
      - "${BIND_IP}:8804:8804/tcp"     # Plan (Player Analytics) web dashboard
    environment:
      EULA: "TRUE"
      TYPE: "PAPER"
      VERSION: "26.3"
      MEMORY: "8G"
      MOTD: "${MOTD}"
      TZ: "America/Denver"
      DIFFICULTY: "${DIFFICULTY}"
      ONLINE_MODE: "TRUE"
      VIEW_DISTANCE: "${VIEW_DISTANCE}"
      SIMULATION_DISTANCE: "${SIMULATION_DISTANCE}"
      LEVEL: "${LEVEL}"
      # Whitelist ON (Paper 26.3 makes white-list=true the default anyway, but the
      # image overrides it). Approvals are applied server-side, so an empty list
      # never locks anyone out permanently - see scripts/mc-whitelist.sh.
      ENABLE_WHITELIST: "true"
      ENFORCE_WHITELIST: "true"
      # Seed names for the whitelist. MERGE means these are added to the
      # existing whitelist.json on every start and runtime approvals
      # (whitelist add / fwhitelist add) are NEVER wiped.
      WHITELIST: "${WHITELIST}"
      EXISTING_WHITELIST_FILE: "MERGE"
      ENABLE_RCON: "true"
      RCON_PASSWORD: "${RCON_PASSWORD}"
      RCON_PORT: "25575"
      CREATE_CONSOLE_IN_PIPE: "true"
      PLUGINS: |
        https://download.geysermc.org/v2/projects/geyser/versions/2.12.1/builds/1300/downloads/spigot
        https://download.geysermc.org/v2/projects/floodgate/versions/2.2.5/builds/141/downloads/spigot
        https://cdn.modrinth.com/data/P1OZGk5p/versions/OKm4Zi14/ViaVersion-5.12.3-SNAPSHOT.jar
        https://cdn.modrinth.com/data/NpvuJQoq/versions/DuSWMuYg/ViaBackwards-5.12.3-SNAPSHOT.jar
        https://cdn.modrinth.com/data/Vebnzrzj/versions/b0mk8uS6/LuckPerms-Bukkit-5.5.71.jar
        https://cdn.modrinth.com/data/hXiIvTyT/versions/nY6VN1XH/EssentialsX-2.22.0.jar
        https://cdn.modrinth.com/data/l3Dexbwu/versions/SvYOm8Zu/StellarProtect.jar
        https://cdn.modrinth.com/data/O4o4mKaq/versions/MtwPHMAS/GriefPrevention.jar
        https://cdn.modrinth.com/data/lKEzGugV/versions/pIvQcXW8/PlaceholderAPI-2.12.3.jar
        https://cdn.modrinth.com/data/ayRaM8J7/versions/qZgRzoYs/VaultUnlocked-2.20.3.jar
        https://cdn.modrinth.com/data/fALzjamp/versions/RBuKjN4k/Chunky-Paper-1.5.66.jar
        https://cdn.modrinth.com/data/swbUV1cr/versions/uHQIrUdf/bluemap-5.29-paper.jar
        https://cdn.modrinth.com/data/wJQfHhxh/versions/atygmVru/Plan-5.9-dev-build-3786.jar
    volumes:
      - minecraft_data:/data

  # Nightly world backup to a separate volume, rotated to 7 files.
  backup:
    image: alpine:3.20
    container_name: minecraft-backup
    restart: unless-stopped
    command:
      - /bin/sh
      - -c
      - |
        while true; do
          sleep 300
          ts=$(date +%Y%m%d-%H%M%S)
          if [ -d /data/world ]; then
            tar -czf /backups/world-$$ts.tar.gz -C /data world || true
            ls -1t /backups/world-*.tar.gz 2>/dev/null | tail -n +8 | xargs -r rm -f
          fi
        done
    volumes:
      - minecraft_data:/data:ro
      - minecraft_backups:/backups

volumes:
  minecraft_data:
    name: minecraft-111_data
  minecraft_backups:
    name: minecraft-111_backups

services:
  # One-shot: clears the runtime-generated Geyser config so the git-tracked
  # copy (APPLY_EXTRA_FILES) can be applied on every start.
  config-init:
    image: alpine:3.20
    container_name: minecraft-config-init
    restart: "no"
    command:
      - /bin/sh
      - -c
      - rm -f /data/plugins/Geyser-Spigot/config.yml
    volumes:
      - minecraft_data:/data

  minecraft:
    image: itzg/minecraft-server:java25
    depends_on:
      config-init:
        condition: service_completed_successfully
    container_name: minecraft
    stdin_open: true
    tty: true
    restart: unless-stopped
    ports:
      - "${BIND_IP}:25565:25565/tcp"   # Java Edition
      - "${BIND_IP}:19132:19132/udp"   # Bedrock gameplay (RakNet) - UDP is mandatory
      - "${BIND_IP}:19132:19132/tcp"   # Bedrock signaling (NetherNet) - TCP is mandatory
    environment:
      EULA: "TRUE"
      TYPE: "PAPER"
      VERSION: "26.3"
      MEMORY: "8G"
      MOTD: "${MOTD}"
      DIFFICULTY: "${DIFFICULTY}"
      ONLINE_MODE: "TRUE"
      VIEW_DISTANCE: "${VIEW_DISTANCE}"
      SIMULATION_DISTANCE: "${SIMULATION_DISTANCE}"
      LEVEL: "${LEVEL}"
      ENABLE_RCON: "false"
      CREATE_CONSOLE_IN_PIPE: "true"
      APPLY_EXTRA_FILES: |
        plugins/Geyser-Spigot/config.yml<https://raw.githubusercontent.com/chaseoriginal/minecraft-111/main/geyser-config.yml
      PLUGINS: |
        https://download.geysermc.org/v2/projects/geyser/versions/2.12.1/builds/1300/downloads/spigot
        https://download.geysermc.org/v2/projects/floodgate/versions/2.2.5/builds/141/downloads/spigot
        https://cdn.modrinth.com/data/P1OZGk5p/versions/OKm4Zi14/ViaVersion-5.12.3-SNAPSHOT.jar
        https://cdn.modrinth.com/data/NpvuJQoq/versions/DuSWMuYg/ViaBackwards-5.12.3-SNAPSHOT.jar
        https://cdn.modrinth.com/data/Vebnzrzj/versions/b0mk8uS6/LuckPerms-Bukkit-5.5.71.jar
        https://cdn.modrinth.com/data/hXiIvTyT/versions/nY6VN1XH/EssentialsX-2.22.0.jar
        https://cdn.modrinth.com/data/l3Dexbwu/versions/SvYOm8Zu/StellarProtect.jar
        https://cdn.modrinth.com/data/O4o4mKaq/versions/MtwPHMAS/GriefPrevention.jar
        https://cdn.modrinth.com/data/lKEzGugV/versions/pIvQcXW8/PlaceholderAPI-2.12.3.jar
        https://cdn.modrinth.com/data/ayRaM8J7/versions/qZgRzoYs/VaultUnlocked-2.20.3.jar
        https://cdn.modrinth.com/data/fALzjamp/versions/RBuKjN4k/Chunky-Paper-1.5.66.jar
        https://cdn.modrinth.com/data/swbUV1cr/versions/uHQIrUdf/bluemap-5.29-paper.jar
    volumes:
      - minecraft_data:/data

  # Nightly world backup to a separate volume, rotated to 7 files.
  backup:
    image: alpine:3.20
    container_name: minecraft-backup
    restart: unless-stopped
    command:
      - /bin/sh
      - -c
      - |
        while true; do
          sleep 300
          ts=$(date +%Y%m%d-%H%M%S)
          if [ -d /data/world ]; then
            tar -czf /backups/world-$$ts.tar.gz -C /data world || true
            ls -1t /backups/world-*.tar.gz 2>/dev/null | tail -n +8 | xargs -r rm -f
          fi
        done
    volumes:
      - minecraft_data:/data:ro
      - minecraft_backups:/backups

volumes:
  minecraft_data:
    name: minecraft-111_data
  minecraft_backups:
    name: minecraft-111_backups
